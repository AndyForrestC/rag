name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # 允许手动触发

jobs:
  # 代码质量检查 - SonarCloud
  sonarcloud:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 完整的Git历史用于SonarCloud分析
    
    - name: Get branch name
      id: branch
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          echo "branch_name=${{ github.head_ref }}" >> $GITHUB_OUTPUT
        else
          echo "branch_name=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
        fi
    
    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.branch.name=${{ steps.branch.outputs.branch_name }}

  # 测试和构建 ingestion-service
  test-ingestion-service:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true
    
    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v3
      with:
        path: ingestion-service/.venv
        key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
    
    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      working-directory: ./ingestion-service
      run: poetry install --no-interaction --no-root
    
    - name: Install project
      working-directory: ./ingestion-service
      run: poetry install --no-interaction
    
    - name: Run tests
      working-directory: ./ingestion-service
      run: |
        poetry run pytest tests/ -v --cov --cov-report=xml
    
    - name: Run linting
      working-directory: ./ingestion-service
      run: |
        poetry run black --check .
        poetry run flake8 .
        poetry run mypy .
    
    # - name: Check security vulnerabilities
    #   working-directory: ./ingestion-service
    #   run: |
    #     poetry run safety check
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./ingestion-service/coverage.xml
        flags: ingestion-service

  # 测试和构建 inference-service backend
  test-inference-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true
    
    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v3
      with:
        path: inference-service/backend/.venv
        key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
    
    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      working-directory: ./inference-service/backend
      run: poetry install --no-interaction --no-root
    
    - name: Install project
      working-directory: ./inference-service/backend
      run: poetry install --no-interaction
    
    - name: Run tests
      working-directory: ./inference-service/backend
      run: |
        poetry run pytest tests/ -v --cov --cov-report=xml
    
    - name: Run linting
      working-directory: ./inference-service/backend
      run: |
        poetry run black --check .
        poetry run flake8 .
        poetry run mypy .
    
    # - name: Check security vulnerabilities
    #   working-directory: ./inference-service/backend
    #   run: |
    #     poetry run safety check
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./inference-service/backend/coverage.xml
        flags: inference-backend

  # 测试和构建 inference-service frontend
  test-inference-frontend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: inference-service/frontend/package-lock.json
    
    - name: Install dependencies
      working-directory: ./inference-service/frontend
      run: npm ci
    
    - name: Run linting
      working-directory: ./inference-service/frontend
      run: npm run lint
    
    - name: Run type checking
      working-directory: ./inference-service/frontend
      run: npx tsc --noEmit
    
    - name: Build application
      working-directory: ./inference-service/frontend
      run: npm run build
    
    - name: Run tests
      working-directory: ./inference-service/frontend
      run: npm test -- --coverage --watchAll=false
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./inference-service/frontend/coverage/lcov.info
        flags: inference-frontend

  # 代码质量检查 (暂时禁用 - SonarCloud项目配置问题)
  # code-quality:
  #   runs-on: ubuntu-latest
  #   
  #   steps:
  #   - uses: actions/checkout@v4
  #     with:
  #       fetch-depth: 0
  #   
  #   - name: SonarCloud Scan
  #     uses: SonarSource/sonarcloud-github-action@master
  #     env:
  #       GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  #       SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # 安全测试
  security-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install security tools
      run: |
        pip install safety bandit semgrep
    
    - name: Run Python dependency security check
      run: |
        echo "Checking ingestion-service dependencies..."
        cd ingestion-service && pip install poetry && poetry export -f requirements.txt | safety check --stdin || true
        echo "Checking inference-service backend dependencies..."
        cd ../inference-service/backend && poetry export -f requirements.txt | safety check --stdin || true
    
    - name: Run Python static security analysis
      run: |
        echo "Running bandit security analysis..."
        bandit -r ingestion-service/app/ -f json -o bandit-ingestion.json || true
        bandit -r inference-service/backend/app/ -f json -o bandit-inference.json || true
    
    - name: Run semgrep security analysis
      run: |
        echo "Running semgrep security analysis..."
        semgrep --config=auto --json --output=semgrep-results.json ingestion-service/ inference-service/ || true
    
    # SonarCloud 扫描 (暂时跳过)
    # - name: SonarCloud Scan
    #   uses: SonarSource/sonarcloud-github-action@master
    #   env:
    #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # 集成测试
  integration-tests:
    needs: [test-ingestion-service, test-inference-backend, test-inference-frontend]
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Verify Docker Compose
      run: |
        docker --version
        docker compose version
    
    - name: Check port availability and kill conflicting processes
      run: |
        echo "Checking port availability..."
        # Kill any processes using ports 3001, 8000, 8001
        sudo fuser -k 3001/tcp || true
        sudo fuser -k 8000/tcp || true
        sudo fuser -k 8001/tcp || true
        
        # Wait a moment for processes to terminate
        sleep 2
        
        # Verify ports are free
        if lsof -Pi :3001 -sTCP:LISTEN -t >/dev/null 2>&1; then
          echo "Port 3001 is still in use, attempting to free it..."
          sudo lsof -ti:3001 | xargs -r sudo kill -9
        fi
        
        if lsof -Pi :8000 -sTCP:LISTEN -t >/dev/null 2>&1; then
          echo "Port 8000 is still in use, attempting to free it..."
          sudo lsof -ti:8000 | xargs -r sudo kill -9
        fi
        
        if lsof -Pi :8001 -sTCP:LISTEN -t >/dev/null 2>&1; then
          echo "Port 8001 is still in use, attempting to free it..."
          sudo lsof -ti:8001 | xargs -r sudo kill -9
        fi
        
        # Wait after cleanup
        sleep 3
        
        echo "Port cleanup completed"
    
    - name: Start test environment
      env:
        MODEL: gpt-3.5-turbo-0125
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        MILVUS_API_KEY: ${{ secrets.MILVUS_API_KEY }}
        MILVUS_URI: ${{ secrets.MILVUS_URI }}
        MILVUS_COLLECTION: rag
        MILVUS_DIMENSION: 1536
        COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      run: |
        docker compose -f docker-compose.yml up -d
        sleep 30  # Wait for services to be ready
    
    - name: Wait for services to be healthy
      run: |
        echo "Waiting for services to be healthy..."
        
        # Wait for ingestion service
        timeout 20 bash -c 'while ! curl -f http://localhost:8001/health >/dev/null 2>&1; do echo "Waiting for ingestion service..."; sleep 2; done'
        echo "✅ Ingestion service is healthy"
        
        # Wait for inference backend
        timeout 20 bash -c 'while ! curl -f http://localhost:8000/health >/dev/null 2>&1; do echo "Waiting for inference backend..."; sleep 2; done'
        echo "✅ Inference backend is healthy"
        
        # Wait for frontend
        timeout 20 bash -c 'while ! curl -f http://localhost:3001 >/dev/null 2>&1; do echo "Waiting for frontend..."; sleep 2; done'
        echo "✅ Frontend is healthy"
        
        echo "All services are ready!"
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install test dependencies
      run: |
        pip install pytest requests
    
    - name: Run integration tests
      run: |
        pytest tests/integration/ -v
    
    - name: Show container logs on failure
      if: failure()
      run: |
        echo "=== Container Status ==="
        docker ps -a
        echo ""
        echo "=== Ingestion Service Logs ==="
        docker logs rag-ingestion-service-1 || true
        echo ""
        echo "=== Inference Backend Logs ==="
        docker logs rag-inference-backend-1 || true
        echo ""
        echo "=== Inference Frontend Logs ==="
        docker logs rag-inference-frontend-1 || true
        echo ""
        echo "=== Nginx Logs ==="
        docker logs rag-nginx-1 || true
    
    - name: Stop test environment
      if: always()
      run: |
        docker compose -f docker-compose.yml down

  # Docker 构建测试
  docker-build-test:
    needs: [test-ingestion-service, test-inference-backend, test-inference-frontend]
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build ingestion-service Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./ingestion-service
        file: ./ingestion-service/Dockerfile
        push: false
        tags: rag-ingestion-service:test
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build inference-service backend Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./inference-service/backend
        file: ./inference-service/backend/Dockerfile
        push: false
        tags: rag-inference-backend:test
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build inference-service frontend Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./inference-service/frontend
        file: ./inference-service/frontend/Dockerfile
        push: false
        tags: rag-inference-frontend:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # CI 状态汇总
  ci-success:
    needs: [test-ingestion-service, test-inference-backend, test-inference-frontend, security-tests, integration-tests, docker-build-test]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Check CI status
      run: |
        if [[ "${{ needs.test-ingestion-service.result }}" == "success" && \
              "${{ needs.test-inference-backend.result }}" == "success" && \
              "${{ needs.test-inference-frontend.result }}" == "success" && \
              "${{ needs.security-tests.result }}" == "success" && \
              "${{ needs.integration-tests.result }}" == "success" && \
              "${{ needs.docker-build-test.result }}" == "success" ]]; then
          echo "✅ All CI checks passed successfully!"
          exit 0
        else
          echo "❌ Some CI checks failed!"
          exit 1
        fi
