version: '3.8'

services:
  # Test database
  milvus-test:
    image: milvusdb/milvus:latest
    ports:
      - "19531:19530"
    environment:
      - ETCD_ENDPOINTS=etcd-test:2379
      - MINIO_ADDRESS=minio-test:9000
    volumes:
      - milvus_test_data:/var/lib/milvus
    depends_on:
      - etcd-test
      - minio-test

  etcd-test:
    image: quay.io/coreos/etcd:v3.5.0
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_test_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  minio-test:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: testuser
      MINIO_SECRET_KEY: testpass123
    volumes:
      - minio_test_data:/data
    command: minio server /data --console-address ":9001"

  # Test services
  ingestion-service-test:
    build:
      context: ./ingestion-service
      dockerfile: Dockerfile
    ports:
      - "8003:8000"
    environment:
      - MILVUS_HOST=milvus-test
      - MILVUS_PORT=19530
      - ENVIRONMENT=test
    depends_on:
      - milvus-test
    volumes:
      - ./tests/data:/app/data

  inference-backend-test:
    build:
      context: ./inference-service/backend
      dockerfile: Dockerfile
    ports:
      - "8004:8000"
    environment:
      - MILVUS_HOST=milvus-test
      - MILVUS_PORT=19530
      - ENVIRONMENT=test
    depends_on:
      - milvus-test

  inference-frontend-test:
    build:
      context: ./inference-service/frontend
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_CHAT_API=http://inference-backend-test:8000/api/chat
      - NODE_ENV=test
    depends_on:
      - inference-backend-test

volumes:
  milvus_test_data:
  etcd_test_data:
  minio_test_data:
