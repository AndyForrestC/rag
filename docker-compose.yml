version: '3.8'

services:
  # RAG Ingestion Service
  ingestion-service:
    build:
      context: ./ingestion-service
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    env_file:
      - ./ingestion-service/.env
    volumes:
      - ./ingestion-service:/app
      - ./data:/app/data # Mount local data folder
    networks:
      - rag_network
    restart: unless-stopped

  # RAG Inference Service Backend
  inference-backend:
    build:
      context: ./inference-service/backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./inference-service/backend/.env
    volumes:
      - ./inference-service/backend:/app
    networks:
      - rag_network
    restart: unless-stopped

  # RAG Inference Service Frontend
  inference-frontend:
    build:
      context: ./inference-service/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./inference-service/frontend/.env
    networks:
      - rag_network
    restart: unless-stopped

