apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-backend
  namespace: rag-system
spec:
  replicas: 3
  selector:
    matchLabels:
      app: inference-backend
  template:
    metadata:
      labels:
        app: inference-backend
    spec:
      containers:
      - name: inference-backend
        image: your-registry/rag-inference-backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: MILVUS_HOST
          value: "milvus-service"
        - name: MILVUS_PORT
          value: "19530"
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: inference-backend
  namespace: rag-system
spec:
  selector:
    app: inference-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-frontend
  namespace: rag-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inference-frontend
  template:
    metadata:
      labels:
        app: inference-frontend
    spec:
      containers:
      - name: inference-frontend
        image: your-registry/rag-inference-frontend:latest
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_CHAT_API
          value: "http://inference-backend/api/chat"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: inference-frontend
  namespace: rag-system
spec:
  selector:
    app: inference-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP
